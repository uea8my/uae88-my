<!doctype html>
<html lang="en">
 
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
 
  <link rel="icon" href="favicon.svg">
 
  <title>GameForge+ — Playful Web Studio</title>
 
  <meta name="description"
    content="GameForge+ is a modern, responsive game website with an engaging canvas game.">
 
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
    rel="stylesheet">
 
  <!-- Main CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
 
  <style>
    /* ==============================
       HERO SECTION
    ============================== */
 
    .hero {
      position: relative;
      width: 100%;
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
 
    /* Background image container */
    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
 
    /* Background image */
    .hero-bg img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center;
    }
 
    /* Dark overlay */
    .hero-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }
 
    /* Hero content */
    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
      text-align: center;
      color: #ffffff;
      padding: 40px 20px;
    }
 
    .hero-content h1 {
      margin: 0 0 18px;
      font-size: clamp(32px, 5vw, 64px);
      font-weight: 800;
      line-height: 1.1;
    }
 
    .hero-content p {
      max-width: 700px;
      margin: 0 auto 28px;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.6;
    }
 
    /* ==============================
       MOBILE
    ============================== */
 
    @media (max-width: 767px) {
 
      .hero {
        min-height: 80vh;
      }
 
      .hero-bg img {
        object-position: center center;
      }
 
      .hero-overlay {
        background: rgba(0, 0, 0, 0.42);
      }
 
      .hero-content {
        padding: 30px 18px;
      }
 
      .hero-content h1 {
        font-size: 34px;
      }
 
      .hero-content p {
        font-size: 16px;
      }
    }
 
    /* ==============================
       SMALL MOBILE
    ============================== */
 
    @media (max-width: 480px) {
 
      .hero {
        min-height: 75vh;
      }
 
      .hero-content h1 {
        font-size: 30px;
      }
 
      .hero-content p {
        font-size: 15px;
        line-height: 1.5;
      }
    }
  </style>
</head>
 
 
<body>
 
  <!-- ==============================
       NAVIGATION
  ============================== -->
 
  <nav class="nav">
 
    <div class="container nav-inner">
 
      <!-- Logo -->
      <a class="logo" href="index.html" aria-label="Home">
 
        <img
          src="assets/img/logo.svg"
          alt="GameForge+ icon">
 
        <span>GameForge+</span>
 
      </a>
 
      <!-- Right Navigation -->
      <div class="right">
 
        <a
          class="btn ghost"
          href="javascript:void(0)"
          data-nav-toggle>
          Menu
        </a>
 
        <a
          class="btn"
          href="game.html">
          Play
        </a>
 
      </div>
 
    </div>
 
  </nav>
 
 
  <!-- ==============================
       HERO
  ============================== -->
 
  <header class="hero">
 
    <!--
      MOBILE:
      assets/img/mob.png
 
      DESKTOP:
      assets/img/lap.png
    -->
 
    <picture class="hero-bg">
 
      <!-- Mobile image -->
      <source
        media="(max-width: 767px)"
        srcset="assets/img/mob.png">
 
      <!-- Desktop image -->
      <img
        src="assets/img/lap.png"
        alt=""
        aria-hidden="true">
 
    </picture>
 
 
    <!-- Dark overlay -->
    <div class="hero-overlay"></div>
 
 
    <!-- Hero Content -->
    <div class="container hero-content">
      <a
        class="btn"
        href="index.html">
        Back to site
      </a>
 
    </div>
 
  </header>
 
 
  <!-- ==============================
       FOOTER
  ============================== -->
 
  <footer
    class="footer"
    style="
      background:#0b1220;
      color:#e5e7eb;
      border-top:1px solid #1f2937;
    ">
 
    <div
      class="container"
      style="
        display:flex;
        flex-wrap:wrap;
        gap:14px;
        align-items:center;
        justify-content:space-between;
        padding:18px 24px;
      ">
 
      <!-- Copyright -->
      <div style="opacity:.9;">
        © 2025 GameForge+
      </div>
 
 
      <!-- Footer Navigation -->
      <nav
        style="
          display:flex;
          gap:16px;
          flex-wrap:wrap;
          align-items:center;
        ">
 
        <a
          href="privacy.html"
          style="color:#38bdf8;text-decoration:none;">
          Privacy
        </a>
 
        <a
          href="cookie-policy.html"
          style="color:#38bdf8;text-decoration:none;">
          Cookie Policy
        </a>
 
        <a
          href="disclaimer.html"
          style="color:#38bdf8;text-decoration:none;">
          Disclaimer
        </a>
 
        <a
          href="community-guidelines.html"
          style="color:#38bdf8;text-decoration:none;">
          Community Guidelines
        </a>
 
        <a
          href="dmca.html"
          style="color:#38bdf8;text-decoration:none;">
          DMCA
        </a>
 
        <a
          href="faq.html"
          style="color:#38bdf8;text-decoration:none;">
          FAQ
        </a>
 
        <a
          href="sitemap.html"
          style="color:#38bdf8;text-decoration:none;">
          Sitemap
        </a>
 
        <a
          href="contact.html"
          style="color:#38bdf8;text-decoration:none;">
          Contact
        </a>
 
      </nav>
 
    </div>
 
  </footer>
 
 
  <!-- ==============================
       MAIN JAVASCRIPT
  ============================== -->
 
  <script src="assets/js/main.js"></script>
 
</body>
 
</html>
